services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # host 6380 — 6379 занят Notification Engine'ом при параллельном запуске
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/CollabCanvas.Api/Dockerfile
    ports:
      - "8090:8080"
    environment:
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "3100:80"
    depends_on:
      - api
